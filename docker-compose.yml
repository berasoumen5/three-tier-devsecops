services:

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./Application-Code/backend
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: 3500
      MONGO_CONN_STR: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      USE_DB_AUTH: "true"
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "3500:3500"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./Application-Code/frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: http://localhost:3500/api/tasks
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
